# ==============================================================================
# Claims Plugin Descriptor
# ==============================================================================
# Supports Paper (1.20.4 - 26.3+) and Folia regionized multithreading.
# Standalone subcommand aliases (e.g. /claim, /trust) are registered dynamically
# at runtime via CommandAliasService based on command-aliases.yml and config.yml.
# ==============================================================================

name: Claims
version: '${version}'
main: claims.Claims
api-version: '1.20'
folia-supported: true
description: Preventive land claims, hierarchical trust matrix, and territory protection for Paper and Folia.
authors: [ Claims ]

commands:
  claims:
    description: Open the Claims dashboard GUI or execute subcommands
    usage: /claims [help|claim|info|list|settings|rename|greeting|trust|untrust|extend|transfer|restrict|abandon|abandonall|subdivide|trapped|cancel|menu|admin|adminclaims|adjustblocks|status|reload|alias|aliases]
    aliases: [ cl ]
    permission: claims.use

permissions:
  claims.use:
    description: Access the Claims dashboard, help, and basic inspection/escape commands
    default: true
  claims.claim:
    description: Create, resize, abandon, and manage personal claims, subclaims, and trusts
    default: true
  claims.admin:
    description: Bypass all claim protections, manage admin claims, adjust blocks, and reload config
    default: op
    children:
      claims.use: true
      claims.claim: true
