# ==============================================================================
# Claims 한국어 메시지 (messages_ko.yml)
# ==============================================================================
# Kyori Adventure MiniMessage 형식을 사용합니다: https://docs.advntr.dev/minimessage/format.html
# {owner}, {w}, {l}, {area}, {available} 등의 플레이스홀더는 안전하게 이스케이프됩니다.
# ==============================================================================

# --- 접두사 및 HUD ---
prefix: "<gradient:#38bdf8:#818cf8><bold>Claims</bold></gradient> <dark_gray>»</dark_gray> "
wilderness: "<#4ade80>🌿 야생 (Wilderness)</#4ade80>"
claim-hud: "<#38bdf8>🛡 {owner}</#38bdf8> <gray>({name})</gray> {badge}"
claim-hud-admin: "<#f59e0b>⚜ 관리자 구역</#f59e0b> <gray>({name})</gray>"
shovel-corner-hud: "<#38bdf8>📐 시작점 ({x}, {z})</#38bdf> <gray>| 예상 크기: {w}×{l} ({area}블록) | 보유: {available}</gray>"
shovel-idle-hud: "<#38bdf8>⛏ 영토 도구 ({mode})</#38bdf> <gray>| 우클릭으로 모서리 지정 | 보유 블록: {available}</gray>"

# --- 보스바 모드 안내 배너 ---
bossbar-resizing: "<aqua>📐 영토 크기 조정 중 — 새 모서리 위치를 우클릭하세요</aqua>"
bossbar-subdividing: "<light_purple>⊞ 세부 구역 생성 중 — 반대쪽 모서리를 우클릭하세요</light_purple>"
bossbar-creating: "<aqua>📐 새 영토 생성 중 — 대각선 반대쪽 모서리를 우클릭하세요</aqua>"

# --- 일반 및 명령어 오류 ---
no-permission: "<red>이 기능을 사용할 권한이 없습니다.</red>"
player-only: "<red>플레이어만 사용할 수 있는 명령어입니다.</red>"
reload-done: "<green>Claims 설정과 다국어 메시지를 다시 불러왔습니다.</green>"
command-disabled: "<red>하위 명령어 <white>/{command}</white>는 command-aliases.yml에서 비활성화되어 있습니다.</red>"
player-not-found: "<red>플레이어 <white>{target}</white>의 접속 기록을 찾을 수 없습니다.</red>"
invalid-integer: "<red>수량은 올바른 정수여야 합니다.</red>"
world-disabled: "<red>이 월드에서는 보호구역 기능이 비활성화되어 있습니다.</red>"

# --- 보호 거부 알림 ---
deny-build: "<red>✖ 건축 권한이 없습니다</red> <gray>(소유자: {owner})</gray>"
deny-container: "<red>✖ 컨테이너 사용 권한이 없습니다</red> <gray>(소유자: {owner})</gray>"
deny-access: "<red>✖ 상호작용 권한이 없습니다</red> <gray>(소유자: {owner})</gray>"
deny-manage: "<red>✖ 영토 관리 권한이 없습니다</red> <gray>(소유자: {owner})</gray>"
deny-pvp: "<red>✖ 이 구역에서는 PvP가 금지되어 있습니다.</red>"

# --- 영토 생성, 크기 조정 및 정보 ---
claim-created: "<green>영토가 생성되었습니다! 크기: <white>{w}×{l}</white> (<white>{area}</white>블록)</green>"
claim-resized: "<green>영토 크기가 조정되었습니다! 새 크기: <white>{w}×{l}</white> (<white>{area}</white>블록)</green>"
subclaim-created: "<green>세부 구역(서브클레임)이 생성되었습니다!</green>"
claim-abandoned: "<yellow>영토를 포기했습니다. 반환된 클레임 블록: <white>{refund}</white></yellow>"
claims-abandoned-all: "<yellow>모든 보호구역(<white>{count}</white>개)을 포기했습니다. 반환된 블록: <white>{refund}</white></yellow>"
claim-overlap: "<red>다른 영토와 겹치므로 생성/확장할 수 없습니다.</red>"
claim-too-small: "<red>영토 최소 크기({min_w}×{min_w}, {min_area}블록)보다 작습니다.</red>"
claim-insufficient-blocks: "<red>클레임 블록이 부족합니다! 필요: <white>{needed}</white>, 보유: <white>{available}</white></red>"
outside-parent: "<red>세부 구역은 상위 보호구역의 경계를 벗어날 수 없습니다.</red>"
claim-update-failed: "<red>보호구역을 생성하거나 수정할 수 없습니다.</red>"
not-in-claim: "<red>현재 위치에 보호구역이 없습니다.</red>"
must-be-in-subclaim: "<yellow>세부 구역(서브클레임) 내부에 서 있어야 합니다.</yellow>"
no-claims-owned: "<gray>소유하고 있는 보호구역이 없습니다.</gray>"
claim-transferred: "<green>보호구역 소유권을 <white>{target}</white>님에게 양도했습니다.</green>"
claim-renamed: "<green>보호구역 이름을 <white>{name}</white>(으)로 변경했습니다.</green>"
claim-greeting-updated: "<green>입장 인사말을 변경했습니다: <white>{greeting}</white></green>"
claim-greeting-cleared: "<yellow>보호구역 입장 인사말을 삭제했습니다.</yellow>"

# --- 권한 및 세부 구역 격리 ---
trust-updated: "<green><white>{target}</white>님에게 <aqua>{level}</aqua> 권한을 부여했습니다.</green>"
trust-removed: "<yellow><white>{target}</white>님의 권한을 해제했습니다.</yellow>"
trust-cleared-all: "<yellow>이 보호구역의 모든 신뢰 권한을 초기화했습니다.</yellow>"
subclaim-restricted: "<aqua>세부 구역 상속 차단(inheritNothing): <white>{state}</white></aqua>"

# --- 조회, 도구 및 탈출 ---
claim-inspect: "<aqua>[{name}]</aqua> <gray>소유자:</gray> <white>{owner}</white> <gray>| 크기:</gray> <white>{w}×{l} ({area}블록)</white> <gray>| 내 권한:</gray> <green>{trust}</green>"
claim-nearby-highlighted: "<gray>주변 보호구역을 강조 표시했습니다 (<white>{name}</white>, 소유자: <white>{owner}</white>).</gray>"
claim-none-nearby: "<gray>주변에서 보호구역을 찾지 못했습니다.</gray>"
mode-switched: "<aqua>영토 도구 모드가 <white>{mode}</white>(으)로 전환되었습니다.</aqua>"
mode-switched-admin: "<gold>영토 도구 모드가 <white>{mode}</white>(으)로 전환되었습니다.</gold>"
selection-cleared: "<gray>영토 선택 상태를 초기화했습니다.</gray>"
trapped-success: "<green>안전한 외곽 위치로 이동했습니다.</green>"
trapped-not-needed: "<yellow>현재 위치에서는 탈출이 필요하지 않거나 소유자/권한 보유 구역입니다.</yellow>"
trapped-no-safe-spot: "<red>주변에서 안전한 야생 위치를 찾지 못했습니다.</red>"
portal-trap-rescued: "<green>네더 포탈 갇힘이 감지되어 안전한 위치로 이동했습니다.</green>"

# --- 관리자 ---
claim-blocks-adjusted: "<green><white>{target}</white>님의 클레임 블록을 조정했습니다 (보너스: <white>{bonus}</white>, 보유: <white>{available}</white>).</green>"
